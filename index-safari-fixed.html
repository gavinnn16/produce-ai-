  <a class="logo" href="#dashboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19C5 10 10 5 20 5c0 9-5 15-13 15"/><path d="M5 19l8-8"/></svg>PRODUCE AI</a>

  </nav>
  <div style="display:flex;gap:8px;align-items:center"><button class="install-btn" id="installApp">Install app</button><div class="pill">Model: <span class="ms"></span></div></div>
</header>
<main><div id="app"></div></main><div id="tt"></div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8.5/dist/teachablemachine-image.min.js"></script>
<script src="produce-database.js"></script>
<script>
/* ================= CONFIGURATION: paste your Teachable Machine model URL here ================= */
const CFG = {
  MODEL_URL: "https://teachablemachine.withgoogle.com/models/9e_j2f3fa/", // e.g. https://teachablemachine.withgoogle.com/models/AbCdEf123/
  VERSION: "2.0.0",
  LOW_CONFIDENCE: 0.6
};
/* ============================================================================================== */

/* Produce profiles live in produce-database.js, separate from model inference. */
const P = window.PRODUCE_DATABASE;

/* ---------- helpers ---------- */
const $=(s,e=document)=>e.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pct=p=>(p*100).toFixed(1)+"%",fmtD=t=>new Date(t).toLocaleString(),info=n=>window.getProduceInfo(String(n).replace(/^(edible|inedible)\s+/i,""));
const count=l=>l.reduce((o,s)=>(o[s.name]=(o[s.name]||0)+1,o),{});
const empty=(t,d)=>`<div class="em"><b>${t}</b><p>${d}</p></div>`,card=(t,v)=>`<div class="card kp"><div class="mu">${t}</div><div class="kv">${v}</div></div>`;
const bars=(l,hl)=>l.map(([n,w,v],k)=>`<div class="br${hl&&!k?" top":""}"><span>${esc(n)}</span><div class="tr"><i style="width:${Math.max(0,Math.min(100,w))}%"></i></div><b>${v}</b></div>`).join("");
let tto;const toast=m=>{const t=$("#tt");t.textContent=m;t.style.display="block";clearTimeout(tto);tto=setTimeout(()=>t.style.display="none",2600)};
const S=Object.assign({theme:"dark",sound:false,cam:"environment",top:"5"},JSON.parse(localStorage.getItem("pa")||"{}"));
const saveS=()=>{localStorage.setItem("pa",JSON.stringify(S));document.documentElement.dataset.theme=S.theme};
const beep=()=>{try{const c=new AudioContext(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);g.gain.value=.05;o.frequency.value=660;o.start();o.stop(c.currentTime+.12)}catch{}};

/* ---------- IndexedDB ---------- */
const idb=new Promise((res,rej)=>{const r=indexedDB.open("produceai",1);r.onupgradeneeded=()=>r.result.createObjectStore("scans",{keyPath:"id"});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const tx=async(m,f)=>{const d=await idb;return new Promise((res,rej)=>{const t=d.transaction("scans",m),q=f(t.objectStore("scans"));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error)})};
const getAll=()=>tx("readonly",s=>s.getAll()),put=o=>tx("readwrite",s=>s.put(o)),del=id=>tx("readwrite",s=>s.delete(id)),clr=()=>tx("readwrite",s=>s.clear());
let scans=[];

/* ---------- model (loaded once) ---------- */
let model,labels=[],mstate="idle",merr="";
const modelUrl=()=>{const u=(localStorage.getItem("murl")||CFG.MODEL_URL||"").trim();if(!u||u.includes("PASTE_MY"))return"";return u.endsWith("/")?u:u+"/"};
const stat=()=>({idle:"Not loaded",nourl:"No model URL set",loading:"Loading…",ready:`Ready · ${labels.length} classes`,error:"Failed to load"}[mstate]);
const statusUI=()=>{document.querySelectorAll(".ms").forEach(e=>e.textContent=stat())};
async function loadModel(){
  const u=modelUrl();if(!u){mstate="nourl";return statusUI()}
  mstate="loading";statusUI();
  try{
    // Safari compatibility fallback: avoid WebGL shader compilation.
    if(window.tf && tf.setBackend){await tf.setBackend("cpu");await tf.ready();}
    model=await tmImage.load(u+"model.json",u+"metadata.json");
    labels=model.getClassLabels();mstate="ready";
  }
  catch(e){mstate="error";merr=e.message||String(e)}
  statusUI();if(location.hash==="#scanner")scanNote()
}
const scanNote=()=>{const m=$("#msg");if(!m)return;m.textContent=mstate==="nourl"?"Add your Teachable Machine model URL in index.html (CFG.MODEL_URL) or in Settings.":mstate==="error"?"Model failed to load: "+merr+". Check the URL in Settings.":mstate==="loading"?"Model is loading…":""};

/* ---------- router ---------- */
let stream=null,facing=S.cam,pend=null,cur=null;
const stopCam=()=>{if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}};
async function route(){
  stopCam();const h=location.hash.slice(1).split("/");
  document.querySelectorAll("nav a").forEach(a=>a.classList.toggle("on",a.getAttribute("href")==="#"+(h[0]||"dashboard")));

function stage(s){
  const st=$("#st"),c=$("#ctl");if(!st)return;if(s!=="live")stopCam();
  if(s==="live"){st.innerHTML='<video id="v" playsinline muted autoplay></video>';c.innerHTML='<button class="btn" data-a="cap">Capture</button><button class="ghost" data-a="flip">Switch camera</button><button class="ghost" data-a="stop">Close</button>'}
  else if(s==="prev"){st.innerHTML=`<img id="pv" src="${pend}" alt="Selected image">`;c.innerHTML='<button class="btn" id="anb" data-a="an">Analyze image</button><button class="ghost" data-a="retake">Retake</button>'}
  else{st.innerHTML="<div><p>Drag and drop a JPG, PNG or WEBP here</p></div>";c.innerHTML='<button class="btn" data-a="cam">Open camera</button><button class="ghost" data-a="up">Upload image</button><input id="fi" type="file" accept="image/jpeg,image/png,image/webp" hidden>'}

async function startCam(){
  stopCam();msg("");
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){stage("idle");return msg("Camera needs HTTPS or localhost. Use the deployed HTTPS link on your phone.")}
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing},audio:false});const v=$("#v");v.srcObject=stream;await v.play()}
  catch(e){stage("idle");msg(e.name==="NotAllowedError"?"Camera access was blocked. Chrome/Edge: click the camera or lock icon in the address bar and allow the camera. iPhone: Settings → Safari → Camera → Allow. Then reload.":e.name==="NotFoundError"?"No camera found on this device. You can upload an image instead.":"Could not start the camera: "+e.message)}
}
function file(f){
  if(!f)return;if(!/^image\/(jpeg|png|webp)$/.test(f.type))return msg("Unsupported file type. Use JPG, PNG or WEBP.");
  const r=new FileReader();r.onload=()=>{pend=r.result;stopCam();stage("prev");msg("")};r.onerror=()=>msg("Could not read that file.");r.readAsDataURL(f)
}
function thumb(im){const c=document.createElement("canvas"),k=Math.min(1,480/Math.max(im.naturalWidth,im.naturalHeight));c.width=im.naturalWidth*k;c.height=im.naturalHeight*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);return c.toDataURL("image/jpeg",.7)}
async function analyze(){
  if(mstate!=="ready")return msg(mstate==="loading"?"The model is still loading.":"The model isn't ready. Check the model URL in Settings.");
  const b=$("#anb"),im=$("#pv");
  if(!b||!im)return;
  b.disabled=true;b.textContent="Analyzing…";msg("Preparing image…");
  try{
    if(im.decode)await im.decode();
    if(!im.naturalWidth||!im.naturalHeight)throw new Error("The selected image could not be decoded.");

    // Keep mobile inference lightweight: use a small canvas instead of the original full-resolution photo.
    const size=224,canvas=document.createElement("canvas");
    canvas.width=size;canvas.height=size;
    const ctx=canvas.getContext("2d");
    if(!ctx)throw new Error("Could not prepare the image on this device.");
    const scale=Math.max(size/im.naturalWidth,size/im.naturalHeight);
    const sw=size/scale,sh=size/scale;
    const sx=(im.naturalWidth-sw)/2,sy=(im.naturalHeight-sh)/2;
    ctx.drawImage(im,sx,sy,sw,sh,0,0,size,size);

    await new Promise(resolve=>setTimeout(resolve,30));
    msg("Running prediction…");
    const p=await model.predict(canvas);
    const sc=p.map(x=>({n:x.className,p:x.probability})).sort((a,b)=>b.p-a.p);
    if(!sc.length)throw new Error("The model returned no predictions.");
    cur={id:(crypto.randomUUID?crypto.randomUUID():Date.now()+"-"+Math.random().toString(36).slice(2)),ts:Date.now(),name:sc[0].n,conf:sc[0].p,scores:sc,img:thumb(im)};
    showRes();if(S.sound)beep();
    msg("");
  }catch(e){
    msg("Analysis failed: "+(e&&e.message?e.message:String(e)));
    console.error("PRODUCE AI analysis error:",e);
  }finally{
    b.disabled=false;b.textContent="Analyze image";
  }
}
function showRes(){

  const fruitName = r.name.replace(/^(edible|inedible)\s+/i,"");
  const statusText = low ? "Uncertain result" : edible ? "Model classified as edible" : inedible ? "Model classified as inedible" : "Unrecognized class";
  $("#res").innerHTML=`<div class="card"><h3>Analysis result</h3><div class="rh"><img class="rim" src="${r.img}" alt=""><div><div class="mu">Detected fruit</div><div class="big">${esc(fruitName)}</div><div class="pc">${pct(r.conf)}</div><span class="tag ${low||inedible?"w":""}">${statusText}</span></div></div>

  for(let i=n-1;i>=0;i--){let a,b,l;
    if(t==="m"){a=new Date(d.getFullYear(),d.getMonth()-i,1);b=new Date(d.getFullYear(),d.getMonth()-i+1,1);l=a.toLocaleString(undefined,{month:"short"})}
    else{const k=t==="d"?1:7;b=new Date(d);b.setDate(b.getDate()+1-i*k);a=new Date(b);a.setDate(a.getDate()-k);l=t==="d"?a.getDate():(a.getMonth()+1)+"/"+a.getDate()}
    o.push([l,scans.filter(s=>s.ts>=a&&s.ts<b).length])}
  const mx=Math.max(1,...o.map(x=>x[1]));
  return`<div class="cols">${o.map(([l,v])=>`<div class="col"><span>${v||""}</span><div class="bw"><i style="height:${v/mx*100}%"></i></div><span>${l}</span></div>`).join("")}</div>`
}
async function ana(){
  scans=await getAll();const n=scans.length;
  if(!n){$("#app").innerHTML=`<h1>Analytics</h1><div class="card">${empty("Not enough data yet","Save some scans from the Scanner and your analytics will appear here.")}</div>`;return}
  const ent=Object.entries(count(scans)).sort((a,b)=>b[1]-a[1]),avg=scans.reduce((s,x)=>s+x.conf,0)/n,last=scans.slice().sort((a,b)=>b.ts-a.ts)[0];
  const bk=[["Below 50%",0,.5],["50–70%",.5,.7],["70–90%",.7,.9],["90–100%",.9,1.01]].map(([l,a,b])=>[l,scans.filter(s=>s.conf>=a&&s.conf<b).length]);
  $("#app").innerHTML=`<h1>Analytics</h1><div class="grid">${card("Total scans",n)}${card("Average confidence",pct(avg))}${card("Most detected",esc(ent[0][0])+" ("+ent[0][1]+")")}${card("Least detected",esc(ent[ent.length-1][0])+" ("+ent[ent.length-1][1]+")")}${card("Most recent",esc(last.name))}${card("Unique items",ent.length)}</div>
  <div class="two"><section class="card"><h3>Confidence distribution</h3>${bars(bk.map(([l,v])=>[l,v/n*100,v]))}</section>
  <section class="card"><h3>Daily activity (14 days)</h3>${act("d",14)}</section><section class="card"><h3>Weekly activity (8 weeks)</h3>${act("w",8)}</section>
  <section class="card"><h3>Monthly activity (6 months)</h3>${act("m",6)}</section><section class="card"><h3>Prediction distribution</h3>${bars(ent.map(([a,b])=>[a,b/ent[0][1]*100,b]),true)}</section></div>`
}

/* ---------- Settings & About ---------- */
const dl=(name,type,text)=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
async function exp(t){
  const l=await getAll();if(!l.length)return toast("No scans to export");l.sort((a,b)=>a.ts-b.ts);
  if(t==="json")return dl("produce-ai-history.json","application/json",JSON.stringify(l.map(({img,...r})=>r),null,2));
  const L=[...new Set(l.flatMap(s=>s.scores.map(x=>x.n)))],q=v=>`"${String(v).replace(/"/g,'""')}"`;
  dl("produce-ai-history.csv","text/csv",[["id","date","time","produce","confidence",...L].map(q).join(","),...l.map(s=>{const d=new Date(s.ts);return[s.id,d.toLocaleDateString(),d.toLocaleTimeString(),s.name,s.conf,...L.map(n=>(s.scores.find(x=>x.n===n)||{}).p??"")].map(q).join(",")})].join("\n"))
}

  <div class="row"><input id="mu" style="flex:1" placeholder="Model URL (optional override)" value="${esc(localStorage.getItem("murl")||CFG.MODEL_URL)}"><button class="ghost" data-a="mu">Save and reload</button></div><small class="mu">Version ${CFG.VERSION}</small></section>
  <section class="card"><h3>Data</h3><p class="mu">Scan history is stored locally on this device and browser.</p><div class="row"><button class="ghost" data-a="csv">Export CSV</button><button class="ghost" data-a="json">Export JSON</button><button class="ghost" data-a="clr">Clear scan history</button><button class="ghost" data-a="rst">Reset all local data</button></div></section>
  <section class="card"><h3>More</h3><a href="#about">About PRODUCE AI</a></section></div>`;
  [["s1","theme"],["s2","cam"],["s3","top"]].forEach(([id,k])=>{const e=$("#"+id);e.value=S[k];e.onchange=()=>{S[k]=e.value;if(k==="cam")facing=e.value;saveS()}});

document.addEventListener("click",e=>{
  const tab=e.target.closest("[data-tab]");
  if(tab){e.preventDefault();item(tab.dataset.k,tab.dataset.tab)}
});
document.addEventListener("change",e=>{
  if(e.target.matches("[data-compare]")){
    const k=e.target.dataset.compare;
    if(e.target.checked){
      if(compareSelection.length>=3){e.target.checked=false;toast("Compare up to three items at a time");return}
      if(!compareSelection.includes(k))compareSelection.push(k);
    }else compareSelection=compareSelection.filter(x=>x!==k);
    const c=$("#compare-count");if(c)c.textContent=compareSelection.length+" selected for comparison (up to 3)";
  }
});

/* ---------- events ---------- */
document.addEventListener("click",async e=>{
  if(e.target.classList.contains("md"))return e.target.remove();
  const t=e.target.closest("[data-a]");if(!t)return;const a=t.dataset.a,id=t.dataset.id;
  if(a==="fav")toggleFavourite(t.dataset.k);
  else if(a==="print")window.print();
  else if(a==="download-profile")downloadProfile(t.dataset.k);
  else if(a==="compare-go")location.hash="#compare";
  else if(a==="compare-clear"){compareSelection=[];if(location.hash==="#compare")comparePage();else if(location.hash==="#browse")browse()}
  else if(a==="cam"){stage("live");startCam()}
  else if(a==="up")$("#fi").click();
  else if(a==="flip"){facing=facing==="user"?"environment":"user";startCam()}
  else if(a==="stop")stage("idle");
  else if(a==="cap"){const v=$("#v");if(!v||!v.videoWidth)return;const c=document.createElement("canvas");c.width=v.videoWidth;c.height=v.videoHeight;c.getContext("2d").drawImage(v,0,0);pend=c.toDataURL("image/jpeg",.9);stage("prev")}
  else if(a==="retake"||a==="again"){pend=null;cur=null;$("#res").innerHTML="";stage("idle")}
  else if(a==="an")analyze();
  else if(a==="save"){if(!cur)return;await put(cur);t.textContent="Saved";t.disabled=true;toast("Scan saved")}
  else if(a==="view")view(id);
  else if(a==="x")t.closest(".md").remove();
  else if(a==="del"){if(!confirm("Delete this scan?"))return;await del(id);document.querySelectorAll(".md").forEach(m=>m.remove());route()}
  else if(a==="clr"){if(!confirm("Delete ALL saved scans? This cannot be undone."))return;await clr();toast("History cleared");route()}
  else if(a==="rst"){if(!confirm("Reset all local data (scans and settings)? This cannot be undone."))return;await clr();localStorage.clear();location.reload()}
  else if(a==="csv"||a==="json")exp(a);
  else if(a==="mu"){const v=$("#mu").value.trim();v?localStorage.setItem("murl",v):localStorage.removeItem("murl");model=null;labels=[];loadModel().then(()=>route())}
});
document.addEventListener("change",e=>{if(e.target.id==="fi")file(e.target.files[0])});
window.addEventListener("hashchange",route);
saveS();route();loadModel();
